spring.application.name=Proyecto_Movil_Backend
server.port=8080

# createDatabaseIfNotExist: crea bd_Movil sola si no existe (antes fallaba al arrancar)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_Movil?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El dialecto se detecta solo (la línea explícita sobraba y está obsoleta en Hibernate 6/7)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
